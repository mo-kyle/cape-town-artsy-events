name: Refresh events

on:
  schedule:
    - cron: '0 4 * * *' # 06:00 South Africa time, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'package-lock.json', '.github/workflows/refresh.yml']

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch events from all sources
        run: npm run fetch
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json
          if git diff --cached --quiet; then
            echo "No changes in events.json"
          else
            git commit -m "data: refresh events $(date -u +%Y-%m-%d)"
            git push
          fi
